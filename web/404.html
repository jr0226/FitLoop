<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found - FitLoop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f766e;
      --text-main: #0f172a;
      --text-muted: #475569;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --radius: 16px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--card-bg);
      max-width: 480px;
      width: 100%;
      padding: 40px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05);
      text-align: center;
    }
    .code {
      font-size: 64px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #115e59;
    }
    .links {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 13px;
    }
    .links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has been moved. Please return to the FitLoop homepage.</p>
    <a href="/" class="btn">Return to FitLoop Home</a>
    <div class="links">
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/delete-account.html">Account Deletion</a>
      <a href="mailto:chaijierong8@gmail.com">Contact Support</a>
    </div>
  </div>
</body>
</html>
