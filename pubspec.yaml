name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.6

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  http: ^1.1.0
  simple_barcode_scanner: ^0.4.0
  image_picker: ^1.2.1
  local_auth: ^2.1.6
  google_sign_in: ^6.2.1
  health: ^13.3.1
  permission_handler: ^12.0.3
  fl_chart: ^0.69.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/data/app.png" # Path to your image file
  min_sdk_android: 26 # Your project's minSdk

flutter:
  uses-material-design: true
  assets:
    - assets/data/app.png
